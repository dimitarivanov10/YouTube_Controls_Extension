<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Warmup Tools</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">Dev Warmup Tools</h1>
      <span class="version">v1.0.0</span>
    </header>

    <main class="content">
      <!-- YouTube Playback Speed Section -->
      <section class="section">
        <h2 class="section-title">YouTube Speed</h2>
        <div class="speed-grid">
          <button class="btn" data-speed="1.0">1.0x</button>
          <button class="btn" data-speed="1.25">1.25x</button>
          <button class="btn" data-speed="1.5">1.5x</button>
          <button class="btn" data-speed="1.75">1.75x</button>
          <button class="btn" data-speed="2.0">2.0x</button>
          <button class="btn" data-speed="3.0">3.0x</button>
        </div>
      </section>

      <!-- Active Tab Cookie Inspector Section -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">Active Cookies</h2>
          <span id="cookie-count" class="badge">0</span>
        </div>
        <div id="cookie-list" class="cookie-container">
          <p class="status-message">Fetching active tab cookies...</p>
        </div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
